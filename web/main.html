<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efflorescence</title>
<style>
:root {
  --bg:#FAFAFA; --text:#1C1B1F; --muted:#6B6B70; --faint:#A0A0A5; --line:#E2E2E5; --line2:#EEEEF0;
  --accent:#FF6F3F; --accent-tx:#fff; --error:#C62828;
  --good:#3F9E5B; --none:#C4C4C8; --track:#E6E6E9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1C1B1F; --text:#E6E1E5; --muted:#A3A0A8; --faint:#6C6971; --line:#2F2E34; --line2:#28272C;
    --accent:#D96A3E; --error:#F2726D;
    --good:#5BBF78; --none:#55535A; --track:#2A292E;
  }
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
       font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
       -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
.num { font-variant-numeric:tabular-nums; }
.wrap { width:100%; max-width:1040px; margin:0 auto; padding:0 32px; }
@media (max-width:640px) { .wrap { padding:0 20px; } }

header { border-bottom:1px solid var(--line); }
header .wrap { display:flex; align-items:center; height:56px; gap:28px; }
header .name { font-weight:600; font-size:15px; flex:1; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
nav { display:flex; gap:22px; height:100%; }
nav a { display:flex; align-items:center; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
nav a.on { color:var(--text); border-bottom-color:var(--accent); }
@media (max-width:560px) { header .wrap { gap:14px; } nav { gap:14px; } nav a { font-size:13px; } }

.lab { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }

.light { max-width:600px; padding:36px 0 40px; }
@media (max-width:640px) { .light { padding:28px 0 32px; } }
.v { display:flex; align-items:baseline; gap:12px; margin-top:10px; }
.big { font-size:104px; font-weight:500; line-height:.95; letter-spacing:-.05em; }
.unit { font-size:22px; color:var(--muted); }
@media (max-width:640px) { .big { font-size:88px; } }
.light.off .big { color:var(--faint); }
.d { font-size:14px; color:var(--muted); margin-top:10px; display:flex; align-items:center; gap:8px; min-height:20px; }
.d.err { color:var(--error); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--none); flex:none; }
.dot.good { background:var(--good); }
.d .low { color:var(--error); }

input[type=range] { -webkit-appearance:none; appearance:none; display:block; width:100%; height:32px; margin:14px 0 0; padding:0;
                    background:transparent; cursor:pointer; touch-action:pan-y; }
input[type=range]:focus { outline:none; }
input[type=range]::-webkit-slider-runnable-track { height:3px;
  background:linear-gradient(to right, var(--fill, var(--accent)) var(--p, 0%), var(--track) var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; margin-top:-9.5px; border-radius:50%;
  background:var(--bg); border:2px solid var(--fill, var(--accent)); }
input[type=range]::-moz-range-track { height:3px; background:var(--track); }
input[type=range]::-moz-range-progress { height:3px; background:var(--fill, var(--accent)); }
input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--bg); border:2px solid var(--fill, var(--accent)); }
input[type=range]:focus-visible::-webkit-slider-thumb { outline:2px solid var(--accent); outline-offset:2px; }
.light.off input[type=range] { --fill:var(--none); }
.ticks { position:relative; height:14px; font-size:11px; color:var(--faint); }
.ticks span { position:absolute; transform:translateX(-50%); }

.acts { margin-top:26px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-size:14px; font-weight:500; padding:9px 16px;
       min-width:108px; border-radius:4px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-tx); }
.btn:disabled { opacity:.5; cursor:default; }

footer { border-top:1px solid var(--line); margin-top:auto; padding:18px 0 28px; font-size:12.5px; color:var(--faint); }
footer .l { text-align:center; }
footer .l + .l { margin-top:4px; }
footer .err { color:var(--error); }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="name" id="devname">Efflorescence</div>
  <nav><a class="on" href="/main">Dashboard</a><a href="/schedule">Schedule</a><a href="/config">Settings</a><a href="/info">Device Info</a></nav>
</div></header>

<main class="wrap">
  <section class="light off" id="light">
    <div class="lab">Light</div>
    <div class="v"><span class="big num" id="bri">—</span><span class="unit">%</span></div>
    <div class="d" id="state"></div>
    <input type="range" id="slider" min="1" max="100" step="1" value="1" aria-label="Brightness">
    <div class="ticks"><span style="left:0;transform:none">1</span><span style="left:100%;transform:translateX(-100%)">100</span></div>
    <div class="acts"><button class="btn" type="button" id="toggle" disabled>Turn on</button></div>
  </section>
</main>

<footer><div class="wrap">
  <div class="l"><span id="upd">Connecting…</span><span id="fw"></span></div>
  <div class="l">© 2026 Max Grakov, Saint Petersburg · MIT License</div>
</div></footer>

<script>
"use strict";
const $ = id => document.getElementById(id);

const SEND_GAP_MS = 120;   /* a dragged slider posts at most this often */
const SLIDE_S = 0.2;       /* each step of a drag is eased by the lamp */

let unreachable = false;
let dragging = false;
let lastSent = 0;
let pending = null;
let timer = 0;

function render(j) {
  if (!j || !j.state) return;
  const on = j.state === "ON";
  $("light").className = "light" + (on ? "" : " off");
  $("state").className = "d";
  $("state").innerHTML = '<span class="dot' + (on ? " good" : "") + '"></span><span>' + (on ? "On" : "Off") + "</span>" +
    (j.battery_low ? '<span>·</span><span class="low">battery low</span>' : "");
  $("toggle").textContent = on ? "Turn off" : "Turn on";
  $("toggle").className = "btn" + (on ? "" : " primary");
  $("toggle").disabled = false;
  if (!dragging) setLevel(j.brightness);
}

function setLevel(pct) {
  $("bri").textContent = String(pct);
  $("slider").value = pct;
  $("slider").style.setProperty("--p", (pct - 1) / 99 * 100 + "%");
}

function renderFooter() {
  const el = $("upd");
  if (unreachable) {
    el.textContent = "Device not reachable";
    el.className = "err";
    return;
  }
  el.textContent = "Updated " + new Date().toTimeString().slice(0, 8);
  el.className = "";
}

async function post(cmd) {
  try {
    const r = await fetch("/api/v1/light", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd)
    });
    const j = await r.json();
    unreachable = false;
    if (r.ok) render(j);
  } catch (e) {
    unreachable = true;
  }
  renderFooter();
}

async function load() {
  try {
    const r = await fetch("/api/v1/light");
    const j = await r.json();
    unreachable = false;
    render(j);
  } catch (e) {
    unreachable = true;
  }
  renderFooter();
}

async function loadStatus() {
  try {
    const r = await fetch("/api/v1/status");
    const j = await r.json();
    if (j.device) {
      document.title = j.device.name;
      $("devname").textContent = j.device.name;
      $("fw").textContent = " · Firmware " + j.device.firmware + " · ESP-IDF " + j.device.idf;
    }
  } catch (e) {  }
}

function flush() {
  timer = 0;
  if (pending == null) return;
  lastSent = Date.now();
  const pct = pending;
  pending = null;
  post({ state: "ON", brightness: pct, transition: SLIDE_S });
}

$("slider").addEventListener("input", () => {
  dragging = true;
  const pct = Number($("slider").value);
  setLevel(pct);
  pending = pct;
  const wait = lastSent + SEND_GAP_MS - Date.now();
  if (wait <= 0) flush();
  else if (!timer) timer = setTimeout(flush, wait);
});
$("slider").addEventListener("change", () => {
  dragging = false;
  flush();
});
$("toggle").onclick = () => post({ state: "TOGGLE" });

load();
loadStatus();
setInterval(load, 2000);
setInterval(loadStatus, 300000);
</script>
</body>
</html>
